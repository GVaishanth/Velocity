<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOCITY — Constructor Championship</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/race-screen.css">
    <link rel="stylesheet" href="css/lobby.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/tutorial.css">
    <link rel="stylesheet" href="css/team-setup.css">
</head>
<body>
    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <div class="loader-tire">
            <div class="loader-rim">
                <span class="loader-logo">V</span>
            </div>
        </div>
        <div class="loader-text">LOADING</div>
        <div class="loader-bar">
            <div class="loader-fill" id="loader-fill"></div>
        </div>
        <div class="loader-percent" id="loader-percent">0%</div>
    </div>
    <!-- GAME CONTAINER — All screens render here -->
    <div id="game-container">
        <!-- HOME SCREEN -->
        <div id="screen-home" class="game-screen active">
            <canvas id="tracks-canvas"></canvas>
            <canvas id="waves-canvas"></canvas>
            <div id="tire-wheel-container">
                <div id="tire-wheel">
                    <div class="tire-quadrant" data-section="singleplayer" data-color="#00FF41">
                        <span class="tire-label">SINGLE PLAYER</span>
                    </div>
                    <div class="tire-quadrant" data-section="profile" data-color="#0080FF">
                        <span class="tire-label">PROFILE</span>
                    </div>
                    <div class="tire-quadrant" data-section="multiplayer" data-color="#FF0033">
                        <span class="tire-label">MULTIPLAYER</span>
                    </div>
                    <div class="tire-quadrant" data-section="tutorial" data-color="#FFD700">
                        <span class="tire-label">HOW TO PLAY</span>
                    </div>
                    <div class="tire-rim">
                        <span class="rim-logo">V</span>
                    </div>
                </div>
            </div>
            <div id="home-header">
                <div class="game-title">
                    <span class="title-main">VELOCITY</span>
                    <span class="title-sub">CONSTRUCTOR CHAMPIONSHIP</span>
                </div>
                <!-- Insta-Launch Premium Historical Mission Shortcuts -->
                <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 14px; max-width: 480px; position: relative; z-index: 100;">
                    <button class="btn btn-glow" id="btn-quick-launch-brazil" title="Execute Miracle of Brazil Scenario" style="padding: 14px 24px; font-family: Orbitron; font-weight: 900; font-size: 13px; background: linear-gradient(135deg, rgba(0,255,65,0.25), rgba(0,128,255,0.2)); border: 2px solid #00FF41; color: #00FF41; box-shadow: 0 0 25px rgba(0,255,65,0.6); cursor: pointer; display: flex; align-items: center; gap: 16px; text-align: left; transition: all 0.3s ease; backdrop-filter: blur(8px); border-radius: 12px;">
                        <span style="font-size: 28px; min-width: 40px; text-align: center;">🌧️🇧🇷</span>
                        <span style="line-height: 1.3;">JUMP INTO MIRACLE OF BRAZIL SCENARIO<br><span style="font-size: 11px; color: var(--white); font-family: Rajdhani; font-weight: 700;">Active Rain Radar • Standing Water 65% • P6 Softs Sprint</span></span>
                    </button>
                    <button class="btn btn-glow" id="btn-quick-launch-abudhabi" title="Execute Abu Dhabi Shootout Scenario" style="padding: 14px 24px; font-family: Orbitron; font-weight: 900; font-size: 13px; background: linear-gradient(135deg, rgba(255,215,0,0.25), rgba(255,0,51,0.2)); border: 2px solid #FFD700; color: #FFD700; box-shadow: 0 0 25px rgba(255,215,0,0.6); cursor: pointer; display: flex; align-items: center; gap: 16px; text-align: left; transition: all 0.3s ease; backdrop-filter: blur(8px); border-radius: 12px;">
                        <span style="font-size: 28px; min-width: 40px; text-align: center;">🇦🇪🏆</span>
                        <span style="line-height: 1.3;">JUMP INTO ABU DHABI SHOOTOUT SCENARIO<br><span style="font-size: 11px; color: var(--white); font-family: Rajdhani; font-weight: 700;">Final Lap Safety Car Sprint • ERS Surge • P2 vs Rival Champ</span></span>
                    </button>
                </div>
            </div>
            <div id="home-footer">
                <span class="version">v1.0.0</span>
                <span class="tagline">BUILD. RACE. DOMINATE.</span>
                <div class="home-controls">
                    <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
                    <button id="btn-music" class="icon-btn" title="Toggle Music">🎵</button>
                </div>
            </div>
        </div>
        <!-- SINGLE PLAYER SCREEN -->
        <div id="screen-singleplayer" class="game-screen">
            <div class="screen-content" id="sp-content"></div>
        </div>
        <!-- MULTIPLAYER SCREEN -->
        <div id="screen-multiplayer" class="game-screen">
            <div class="screen-content" id="mp-content"></div>
        </div>
        <!-- PROFILE SCREEN -->
        <div id="screen-profile" class="game-screen">
            <div class="screen-content" id="profile-content"></div>
        </div>
        <!-- TUTORIAL SCREEN -->
        <div id="screen-tutorial" class="game-screen">
            <div class="screen-content" id="tutorial-content"></div>
        </div>
        <!-- TEAM SETUP SCREEN -->
        <div id="screen-team-setup" class="game-screen">
            <div class="screen-content" id="team-setup-content"></div>
        </div>
        <!-- RACE WEEKEND SCREEN -->
        <div id="screen-race-weekend" class="game-screen">
            <div class="screen-content" id="race-weekend-content"></div>
        </div>
        <!-- LIVE RACE SCREEN -->
        <div id="screen-race" class="game-screen">
            <div id="race-top-bar"></div>
            <div id="race-main">
                <div id="race-timing-panel"></div>
                <div id="race-right-panel">
                    <div id="race-track-panel">
                        <canvas id="race-track-canvas"></canvas>
                    </div>
                    <div id="race-tactical-deck">
                        <div class="deck-nav-header">
                            <button class="deck-tab-btn active" data-deck-tab="radio">📻 TEAM RADIO</button>
                            <button class="deck-tab-btn" data-deck-tab="weather">🌦️ SATELLITE RADAR</button>
                            <button class="deck-tab-btn" data-deck-tab="vsc">⚡ VSC PACING SPRINT</button>
                        </div>
                        <div class="deck-content-wrapper">
                            <!-- Deck Tab 1: Team Radio Chat -->
                            <div class="deck-tab-pane active" id="deck-pane-radio">
                                <div id="radio-messages"></div>
                            </div>
                            <!-- Deck Tab 2: Live Doppler Weather Radar (Proposal 4) -->
                            <div class="deck-tab-pane" id="deck-pane-weather"></div>
                            <!-- Deck Tab 3: FIA Virtual Safety Car Minigame (Proposal 5) -->
                            <div class="deck-tab-pane" id="deck-pane-vsc"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="race-bottom-bar"></div>
        </div>
        <!-- RESULTS SCREEN -->
        <div id="screen-results" class="game-screen">
            <div class="screen-content" id="results-content"></div>
        </div>
        <!-- DASHBOARD SCREEN -->
        <div id="screen-dashboard" class="game-screen">
            <div class="screen-content" id="dashboard-content"></div>
        </div>
    </div>
    <!-- TRANSITION OVERLAY -->
    <div id="transition-overlay">
        <div id="transition-tunnel"></div>
    </div>
    <!-- MODAL OVERLAY -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-box">
            <div id="modal-header"></div>
            <div id="modal-body"></div>
            <div id="modal-footer"></div>
        </div>
    </div>
    <!-- NOTIFICATION AREA -->
    <div id="notification-area"></div>
    <!-- SCRIPTS — Order matters -->
    <script src="js/data/teams.js"></script>
    <script src="js/data/drivers.js"></script>
    <script src="js/data/staff.js"></script>
    <script src="js/data/tracks.js"></script>
    <script src="js/data/achievements.js"></script>
    <script src="js/data/tire-compounds.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="js/core/event-bus.js"></script>
    <script src="js/core/save-system.js"></script>
    <script src="js/core/audio-manager.js"></script>
    <script src="js/core/state-manager.js"></script>
    <script src="js/core/game-engine.js"></script>
    <script src="js/home/tracks-background.js"></script>
    <script src="js/home/wave-system.js"></script>
    <script src="js/home/tire-wheel.js"></script>
    <script src="js/home/home-controller.js"></script>
    <script src="js/simulation/tire-model.js"></script>
    <script src="js/simulation/weather-system.js"></script>
    <script src="js/simulation/lap-calculator.js"></script>
    <script src="js/simulation/event-system.js"></script>
    <script src="js/simulation/pit-strategy.js"></script>
    <script src="js/simulation/ai-driver.js"></script>
    <script src="js/simulation/driver-radio.js"></script>
    <script src="js/simulation/race-engine.js"></script>
    <script src="js/rendering/track-renderer.js"></script>
    <script src="js/rendering/car-renderer.js"></script>
    <script src="js/rendering/effects.js"></script>
    <script src="js/rendering/animation-loop.js"></script>
    <script src="js/ui/timing-table.js"></script>
    <script src="js/ui/player-controls.js"></script>
    <script src="js/ui/notifications.js"></script>
    <script src="js/ui/modals.js"></script>
    <script src="js/ui/transitions.js"></script>
    <script src="js/screens/single-player.js"></script>
    <script src="js/screens/multiplayer.js"></script>
    <script src="js/screens/profile.js"></script>
    <script src="js/screens/tutorial.js"></script>
    <script src="js/screens/team-setup.js"></script>
    <script src="js/screens/dashboard.js"></script>
    <script src="js/screens/race-weekend.js"></script>
    <script src="js/screens/race-screen.js"></script>
    <script src="js/screens/results.js"></script>
    <script src="js/core/app.js"></script>
</body>
</html>
